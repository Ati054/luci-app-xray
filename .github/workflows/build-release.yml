name: Build and Release R10

on:
  push:
    branches:
      - codex/r10-profile-metrics
    tags:
      - "*"
  workflow_dispatch:

env:
  PACKAGE_NAME: luci-app-xray

jobs:
  build:
    name: OpenWrt ${{ matrix.id }} / ${{ matrix.target_arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 23.05.5
            target_arch: x86_64
            sdk_url_path: https://downloads.openwrt.org/releases/23.05.5/targets/x86/64
            sdk_name: -sdk-23.05.5-x86-64_
            package_format: ipk
            core_filename: luci-app-xray_3.7.1-10_x86_64.ipk
            status_filename: luci-app-xray-status_3.7.1-10_all.ipk
          - id: 25.12.5
            target_arch: aarch64_cortex-a53
            sdk_url_path: https://downloads.openwrt.org/releases/25.12.5/targets/bcm27xx/bcm2710
            sdk_name: -sdk-25.12.5-bcm27xx-bcm2710_
            package_format: apk
            core_filename: luci-app-xray-3.7.1-r10.apk
            status_filename: luci-app-xray-status-3.7.1-r10.apk

    env:
      SDK_URL_PATH: ${{ matrix.sdk_url_path }}
      SDK_NAME: ${{ matrix.sdk_name }}
      CONFIG_CCACHE: y

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build and proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            build-essential bison ccache cmake file flex gettext git \
            libjson-c-dev libncurses-dev pkg-config qemu-user-static \
            python3-yaml strace unzip wget xsltproc zstd

      - name: Download and verify exact OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DOWNLOAD_DIR="$RUNNER_TEMP/sdk-download-${{ matrix.id }}"
          SDK_HOME="$RUNNER_TEMP/openwrt-sdk-${{ matrix.id }}"
          mkdir -p "$SDK_DOWNLOAD_DIR" "$SDK_HOME"
          wget -q -O "$SDK_DOWNLOAD_DIR/sha256sums" "$SDK_URL_PATH/sha256sums"

          mapfile -t SDK_LINES < <(
            grep -F -- "$SDK_NAME" "$SDK_DOWNLOAD_DIR/sha256sums" |
              grep -E 'Linux-x86_64\.tar\.(xz|zst)$'
          )
          [ "${#SDK_LINES[@]}" -eq 1 ] || {
            echo "::error::Expected one SDK matching $SDK_NAME, found ${#SDK_LINES[@]}" >&2
            printf '%s\n' "${SDK_LINES[@]}" >&2
            exit 1
          }
          SDK_FILE="$(printf '%s\n' "${SDK_LINES[0]}" | awk '{print $2}' | sed 's/^\*//')"
          printf '%s\n' "${SDK_LINES[0]}" > "$SDK_DOWNLOAD_DIR/sdk.sha256"
          wget -q -O "$SDK_DOWNLOAD_DIR/$SDK_FILE" "$SDK_URL_PATH/$SDK_FILE"
          (
            cd "$SDK_DOWNLOAD_DIR"
            sha256sum -c sdk.sha256
          )
          tar -C "$SDK_HOME" --strip-components=1 -xf "$SDK_DOWNLOAD_DIR/$SDK_FILE"
          {
            echo "SDK_HOME=$SDK_HOME"
            echo "APK_HOST=$SDK_HOME/staging_dir/host/bin/apk"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          } >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: openwrt-ccache-v1-${{ runner.os }}-${{ matrix.id }}-${{ matrix.target_arch }}-${{ github.run_id }}
          restore-keys: |
            openwrt-ccache-v1-${{ runner.os }}-${{ matrix.id }}-${{ matrix.target_arch }}-

      - name: Configure feeds and package source
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_HOME"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          [ ! -e "package/$PACKAGE_NAME" ]
          ln -s "$GITHUB_WORKSPACE" "package/$PACKAGE_NAME"
          make defconfig

      - name: Build SDK-selected host ucode
        shell: bash
        run: |
          set -euo pipefail
          sh "$GITHUB_WORKSPACE/tests/ci/setup_ucode.sh" "$SDK_HOME"
          echo "LD_LIBRARY_PATH=/opt/ucode-pinned/lib:/usr/lib:/usr/lib64:/usr/local/lib" >> "$GITHUB_ENV"

      - name: Fetch and verify official Xray 26.7.28
        shell: bash
        run: |
          set -euo pipefail
          sh "$GITHUB_WORKSPACE/tests/ci/fetch_xray.sh" v26.7.28 "$RUNNER_TEMP/xray-bin"

      - name: Run complete host test suite
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/ucode-pinned/bin:$RUNNER_TEMP/xray-bin:$SDK_HOME/staging_dir/host/bin:$PATH"
          CI=true \
            UCODE_BIN=/opt/ucode-pinned/bin/ucode \
            XRAY_BIN="$RUNNER_TEMP/xray-bin/xray" \
            sh "$GITHUB_WORKSPACE/tests/run_tests.sh"

      - name: Build core and status packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_HOME"
          ccache --max-size=1G
          ccache --zero-stats
          make "package/$PACKAGE_NAME/core/clean" V=s
          make -j"$(nproc)" "package/$PACKAGE_NAME/core/compile" V=s
          make "package/$PACKAGE_NAME/status/clean" V=s
          make -j"$(nproc)" "package/$PACKAGE_NAME/status/compile" V=s
          ccache --show-stats

      - name: Save compiler cache
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: openwrt-ccache-v1-${{ runner.os }}-${{ matrix.id }}-${{ matrix.target_arch }}-${{ github.run_id }}

      - name: Locate exact R10 package identities
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CORE_CANDIDATES < <(find "$SDK_HOME/bin" -type f -name '${{ matrix.core_filename }}' -print)
          mapfile -t STATUS_CANDIDATES < <(find "$SDK_HOME/bin" -type f -name '${{ matrix.status_filename }}' -print)
          [ "${#CORE_CANDIDATES[@]}" -eq 1 ] || {
            echo "::error::Expected one exact core R10 package, found ${#CORE_CANDIDATES[@]}" >&2
            printf '%s\n' "${CORE_CANDIDATES[@]}" >&2
            exit 1
          }
          [ "${#STATUS_CANDIDATES[@]}" -eq 1 ] || {
            echo "::error::Expected one exact status R10 package, found ${#STATUS_CANDIDATES[@]}" >&2
            printf '%s\n' "${STATUS_CANDIDATES[@]}" >&2
            exit 1
          }
          {
            echo "CORE_PACKAGE=${CORE_CANDIDATES[0]}"
            echo "STATUS_PACKAGE=${STATUS_CANDIDATES[0]}"
          } >> "$GITHUB_ENV"

      - name: Verify real package contents and modes
        shell: bash
        run: |
          set -euo pipefail
          sh "$GITHUB_WORKSPACE/tests/ci/verify_package_contents.sh" \
            "${{ matrix.package_format }}" "$CORE_PACKAGE" "$APK_HOST"
          sh "$GITHUB_WORKSPACE/tests/ci/verify_package_contents.sh" \
            "${{ matrix.package_format }}" "$STATUS_PACKAGE" "$APK_HOST"

      - name: Assemble verified artifact
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="$GITHUB_WORKSPACE/dist/openwrt-${{ matrix.id }}-all"
          mkdir -p "$DIST_DIR"

          if [ "${{ matrix.id }}" = "25.12.5" ]; then
            COLLECTOR_PAYLOAD="$RUNNER_TEMP/r10-collector-payload"
            mkdir -p "$COLLECTOR_PAYLOAD"
            "$APK_HOST" --allow-untrusted extract --no-chown \
              --destination "$COLLECTOR_PAYLOAD" "$CORE_PACKAGE"
            bash "$GITHUB_WORKSPACE/scripts/build_r10_offline_bundle.sh" \
              "$APK_HOST" "$DIST_DIR" "$CORE_PACKAGE" "$STATUS_PACKAGE" "$GITHUB_WORKSPACE"
            install -m 0755 \
              "$COLLECTOR_PAYLOAD/usr/libexec/xray-sockstats" \
              "$DIST_DIR/xray-sockstats-aarch64"
            cp -p \
              "$GITHUB_WORKSPACE/install_and_smoke_r10.sh" \
              "$GITHUB_WORKSPACE/tests/hardware/profile_mode_smoke.sh" \
              "$GITHUB_WORKSPACE/tests/fixtures/profile-smoke-a.json" \
              "$GITHUB_WORKSPACE/tests/fixtures/profile-smoke-b.json" \
              "$GITHUB_WORKSPACE/tests/fixtures/profile-invalid.json" \
              "$GITHUB_WORKSPACE/ROLLBACK-R10.txt" \
              "$DIST_DIR/"
          else
            cp -p "$CORE_PACKAGE" "$STATUS_PACKAGE" "$DIST_DIR/"
          fi

          {
            echo "project=luci-app-xray"
            echo "variant=modern-vless-reverse"
            echo "package_version=3.7.1"
            echo "package_release=10"
            echo "openwrt_release=${{ matrix.id }}"
            echo "package_format=${{ matrix.package_format }}"
            echo "package_architecture=${{ matrix.target_arch }}"
            echo "sdk_target_architecture=${{ matrix.target_arch }}"
            echo "git_commit=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "core_package=$(basename "$CORE_PACKAGE")"
            echo "status_package=$(basename "$STATUS_PACKAGE")"
            echo "generated_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$DIST_DIR/BUILD-INFO-openwrt-${{ matrix.id }}-all.txt"

          if [ "${{ matrix.id }}" = "25.12.5" ]; then
            sh "$GITHUB_WORKSPACE/tests/hardware/profile_mode_smoke.sh" --preflight
            sh "$GITHUB_WORKSPACE/tests/ci/run_target_ucode.sh" \
              "$APK_HOST" "$DIST_DIR" "$CORE_PACKAGE" "$RUNNER_TEMP/xray-bin/xray"
            (
              cd "$DIST_DIR"
              find . -maxdepth 1 -type f ! -name 'SHA256SUMS-R10.txt' -printf '%P\0' |
                sort -z |
                xargs -0 sha256sum > SHA256SUMS-R10.txt
              sha256sum -c SHA256SUMS-R10.txt
            )
          else
            (
              cd "$DIST_DIR"
              sha256sum \
                '${{ matrix.core_filename }}' \
                '${{ matrix.status_filename }}' \
                'BUILD-INFO-openwrt-23.05.5-all.txt' > SHA256SUMS-openwrt-23.05.5-all.txt
              sha256sum -c SHA256SUMS-openwrt-23.05.5-all.txt
            )
          fi

          if find "$DIST_DIR" -maxdepth 1 -type f -size 0 -print | grep -q .; then
            echo "::error::Artifact contains a zero-byte file" >&2
            exit 1
          fi
          find "$DIST_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload complete verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-r10-openwrt-${{ matrix.id }}-all-${{ matrix.target_arch }}
          path: dist/openwrt-${{ matrix.id }}-all/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tag assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified matrix artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: luci-app-xray-r10-openwrt-*
          path: release-assets
          merge-multiple: true

      - name: Reject empty release files
        shell: bash
        run: |
          set -euo pipefail
          if find release-assets -type f -size 0 -print | grep -q .; then
            echo "::error::Release contains a zero-byte file" >&2
            exit 1
          fi
          find release-assets -type f -printf '%P %s bytes\n' | sort

      - name: Release tag assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
